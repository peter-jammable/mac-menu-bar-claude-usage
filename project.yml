name: ClawUsage
options:
  bundleIdPrefix: com.clawusage
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  minimumXcodeGenVersion: "2.35.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
targets:
  ClawUsage:
    type: application
    platform: macOS
    sources:
      - path: ClawUsage
        type: group
    resources:
      - path: Assets.xcassets
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clawusage.app
        INFOPLIST_FILE: ClawUsage/Info.plist
        CODE_SIGN_ENTITLEMENTS: ClawUsage/ClawUsage.entitlements
        PRODUCT_NAME: ClawUsage
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: false
        COMBINE_HIDPI_IMAGES: true
        CODE_SIGN_STYLE: Automatic
