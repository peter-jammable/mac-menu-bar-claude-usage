name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Install Apple certificate
      env:
        CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
        CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
      run: |
        # Create temporary keychain
        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
        KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

        security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

        # Import certificate (trim any trailing whitespace from the secret)
        CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
        echo -n "$CERTIFICATE_P12" | tr -d '[:space:]' | base64 --decode -o $CERTIFICATE_PATH
        security import $CERTIFICATE_PATH -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
        security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security list-keychain -d user -s $KEYCHAIN_PATH

    - name: Build App
      run: |
        xcodebuild -project ClawUsage.xcodeproj \
          -scheme ClawUsage \
          -configuration Release \
          -derivedDataPath build \
          CODE_SIGN_IDENTITY="Developer ID Application" \
          CODE_SIGN_STYLE=Manual \
          DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
          CODE_SIGN_ENTITLEMENTS=ClawUsage/ClawUsage.Release.entitlements \
          ENABLE_HARDENED_RUNTIME=YES

    - name: Create DMG
      run: |
        mkdir -p dmg_contents
        cp -R build/Build/Products/Release/ClawUsage.app dmg_contents/
        ln -s /Applications dmg_contents/Applications
        hdiutil create -volname "ClawUsage" -srcfolder dmg_contents -ov -format UDZO ClawUsage-${{ github.ref_name }}.dmg

    - name: Sign DMG
      run: |
        codesign --force --sign "Developer ID Application" ClawUsage-${{ github.ref_name }}.dmg

    - name: Notarize DMG
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        xcrun notarytool submit ClawUsage-${{ github.ref_name }}.dmg \
          --apple-id "$APPLE_ID" \
          --password "$APPLE_ID_PASSWORD" \
          --team-id "$APPLE_TEAM_ID" \
          --wait

        # Staple the notarization ticket to the DMG
        xcrun stapler staple ClawUsage-${{ github.ref_name }}.dmg

    - name: Create ZIP
      run: |
        cd build/Build/Products/Release
        zip -r ../../../../ClawUsage-${{ github.ref_name }}.zip ClawUsage.app

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ClawUsage-${{ github.ref_name }}.dmg
          ClawUsage-${{ github.ref_name }}.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Clean up keychain
      if: always()
      run: |
        security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
